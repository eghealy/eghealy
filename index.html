    <script>
        (function () {
            var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var TYPE_SPEED = 85;
            var ERASE_SPEED = 45;
            var HOLD_TIME = 1000;
            var PAUSE_TIME = 350;
            var STATIC_HOLD = 1600;
            var WORD_TYPE_SPEED = 35;
            var COMMA_PAUSE = 180;

            var FINAL_WORD = "Revise.";

            function runCycle(el, onComplete) {
                var words;
                try {
                    words = JSON.parse(el.getAttribute('data-words'));
                } catch (e) {
                    if (onComplete) onComplete();
                    return;
                }
                var textEl = el.querySelector('.write-cycle-text');
                if (!textEl || !words || !words.length) {
                    if (onComplete) onComplete();
                    return;
                }
                var finalWord = el.getAttribute('data-final-word') || FINAL_WORD;
                var cursorHTML = '<span class="write-cycle-cursor"></span>';

                function render(lines) {
                    textEl.innerHTML = lines.join('<br>') + cursorHTML;
                }

                if (reduced) {
                    render(words);
                    setTimeout(function () {
                        render([finalWord]);
                        if (onComplete) onComplete();
                    }, STATIC_HOLD);
                    return;
                }

                function typeWord(idx, cb) {
                    var word = words[idx];
                    var priorLines = words.slice(0, idx);
                    var charIdx = 0;
                    (function step() {
                        render(priorLines.concat([word.slice(0, charIdx)]));
                        if (charIdx < word.length) {
                            var lastChar = charIdx > 0 ? word[charIdx - 1] : '';
                            charIdx++;
                            setTimeout(step, lastChar === ',' ? COMMA_PAUSE : WORD_TYPE_SPEED);
                        } else {
                            cb();
                        }
                    })();
                }

                function typeAll(idx) {
                    if (idx >= words.length) {
                        setTimeout(collapseToFinal, HOLD_TIME);
                        return;
                    }
                    typeWord(idx, function () {
                        setTimeout(function () { typeAll(idx + 1); }, PAUSE_TIME);
                    });
                }

                function eraseWord(idx, cb) {
                    if (idx < 0) { cb(); return; }
                    var word = words[idx];
                    var priorLines = words.slice(0, idx);
                    var charIdx = word.length;
                    (function step() {
                        render(priorLines.concat(charIdx > 0 ? [word.slice(0, charIdx)] : []));
                        if (charIdx > 0) {
                            charIdx--;
                            setTimeout(step, ERASE_SPEED);
                        } else {
                            eraseWord(idx - 1, cb);
                        }
                    })();
                }

                function typeFinal() {
                    var charIdx = 0;
                    (function step() {
                        render([finalWord.slice(0, charIdx)]);
                        if (charIdx < finalWord.length) {
                            charIdx++;
                            setTimeout(step, WORD_TYPE_SPEED);
                        } else {
                            finishCursor();
                        }
                    })();
                }

                function finishCursor() {
                    var cursor = textEl.querySelector('.write-cycle-cursor');
                    if (!cursor || reduced) {
                        if (cursor) cursor.remove();
                        if (onComplete) onComplete();
                        return;
                    }
                    cursor.classList.add('write-cycle-cursor-end');
                    cursor.addEventListener('animationend', function handler() {
                        cursor.removeEventListener('animationend', handler);
                        cursor.remove();
                        if (onComplete) onComplete();
                    });
                }

                function collapseToFinal() {
                    eraseWord(words.length - 1, typeFinal);
                }

                typeAll(0);
            }

            var cycleEls = Array.prototype.slice.call(document.querySelectorAll('.write-cycle'));
            (function startNext(idx) {
                if (idx >= cycleEls.length) return;
                runCycle(cycleEls[idx], function () { startNext(idx + 1); });
            })(0);

            var wordmarkText = document.getElementById('hero-wordmark-text');
            var wordmarkCursor = document.querySelector('.hero-wordmark-cursor');
            if (wordmarkText) {
                var fullName = wordmarkText.textContent;
                if (reduced) {
                    if (wordmarkCursor) wordmarkCursor.style.visibility = 'hidden';
                } else {
                    wordmarkText.textContent = '';
                    (function typeName(idx) {
                        wordmarkText.textContent = fullName.slice(0, idx);
                        if (idx < fullName.length) {
                            setTimeout(function () { typeName(idx + 1); }, TYPE_SPEED);
                        } else if (wordmarkCursor) {
                            setTimeout(function () { wordmarkCursor.style.visibility = 'hidden'; }, 1200);
                        }
                    })(0);
                }
            }
        })();
    </script>
    <script>
        (function () {
            var navBrand = document.querySelector('.navbar-brand');
            var heroWordmark = document.querySelector('.ornamentation');
            if (!navBrand || !heroWordmark) return;

            navBrand.classList.add('navbar-brand-hidden');

            function updateNavBrand() {
                var rect = heroWordmark.getBoundingClientRect();
                var scrolledPast = rect.bottom < 0;
                navBrand.classList.toggle('navbar-brand-hidden', !scrolledPast);
            }

            window.addEventListener('scroll', updateNavBrand, { passive: true });
            updateNavBrand();
        })();
    </script>
    <script>
        (function () {
            var navLinks = document.querySelectorAll('.navbar-nav .nav-link');
            var sections = [];
            navLinks.forEach(function (link) {
                var hash = (link.getAttribute('href') || '').split('#')[1];
                var el = hash ? document.getElementById(hash) : null;
                var navItem = link.closest('.nav-item');
                if (el && navItem) {
                    sections.push({ el: el, navItem: navItem, navLink: link });
                }
            });
            if (!sections.length) return;

            function updateActiveNav() {
                var scrollPos = window.scrollY + 120;
                var visibleSections = sections.filter(function (s) {
                    return s.navItem.offsetParent !== null;
                });
                if (!visibleSections.length) return;
                var current = visibleSections[0];
                var atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
                if (atBottom) {
                    current = visibleSections[visibleSections.length - 1];
                } else {
                    visibleSections.forEach(function (s) {
                        if (s.el.offsetTop <= scrollPos) {
                            current = s;
                        }
                    });
                }
                sections.forEach(function (s) {
                    var isCurrent = s === current;
                    s.navItem.classList.toggle('active', isCurrent);
                    if (isCurrent) {
                        s.navLink.setAttribute('aria-current', 'true');
                    } else {
                        s.navLink.removeAttribute('aria-current');
                    }
                });
            }

            window.addEventListener('scroll', updateActiveNav, { passive: true });
            updateActiveNav();
        })();
    </script>
